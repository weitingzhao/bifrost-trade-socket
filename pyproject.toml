[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bifrost-socket"
version = "0.1.0"
description = "WebSocket edge services (IB Ingestor/AccountAgent/Operator, Massive WS) — Bifrost Trade system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bifrost-core",
    "ib_insync>=0.9.86",
    "websockets>=12.0",
    "aioredis>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-v"
markers = [
    "ib: mark test as requiring live IB connection (deselect with '-m not ib')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
